worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types {
        text/plain glsl frag vert vs fs pde obj;
        font/ttf ttf;
        font/otf otf;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip off;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    etag on;

    map $uri $asset_cache {
        default "public, max-age=86400";
        ~/$ "no-cache";
        ~\.html$ "no-cache";
        ~/(master_manifest(_DEV)?|manifest)\.json$ "no-cache";
        /health "no-store";
    }
    map $status $cache_policy {
        default "no-store";
        200 $asset_cache;
        206 $asset_cache;
        304 $asset_cache;
        301 "no-cache";
    }
    server {
        listen 8080;
        server_name _;
        root /srv/artwork;
        index index.html;
        autoindex off;
        # Preserve relative redirects through any external HTTPS proxy/port.
        absolute_redirect off;
        add_header Cache-Control $cache_policy always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges" always;
        location = /health { default_type text/plain; return 200 "OK\n"; }
        location ~ (^|/)\. { return 404; }
        location ~ \.gz$ { return 404; }
        location / {
            # Nginx's range filter runs after add_header. Forward range requests
            # to the loopback static listener so headers see the final 206/416
            # status, without retaining a success cache policy on errors.
            error_page 418 = @range;
            error_page 403 =404 @missing;
            if ($http_range != "") { return 418; }
            try_files $uri $uri/ =404;
        }
        location @range {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_buffering off;
        }
        error_page 403 =404 @missing;
        location @missing { return 404; }
    }
    server {
        listen 127.0.0.1:8081;
        root /srv/artwork;
        index index.html;
        autoindex off;
        absolute_redirect off;
        access_log off;
        location ~ (^|/)\. { return 404; }
        location ~ \.gz$ { return 404; }
        location / { try_files $uri $uri/ =404; }
        error_page 403 =404 @missing;
        location @missing { return 404; }
    }
}
